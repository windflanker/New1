<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maratha Museum – Counter Desk</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Figtree:wght@200;400;500;600;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="wide">
  <header class="topbar">
    <a class="brand glass-pill" href="/admin">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="16" fill="rgba(255,255,255,.22)"/>
        <path d="M8 24v-8l2-2 2 2v-3l4-4 4 4v3l2-2 2 2v8z" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M16 9V4.5" stroke="#fff" stroke-width="1.4"/><path d="M16 4.5l4 1.6-4 1.6z" fill="#f28a1e"/>
      </svg>
      <div><strong>Counter Desk</strong><span>Maratha Museum staff</span></div>
    </a>
    <nav>
      <a class="glass-pill" href="/">Visitor booking page</a>
      <button class="glass-pill hidden" type="button" id="logout">Sign out</button>
    </nav>
  </header>

  <main>
    <section id="login" class="glass card login-card">
      <h2>Staff sign-in</h2>
      <form id="login-form">
        <div class="input-pill">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg></span>
          <label class="sr-only" for="pin">Staff PIN</label>
          <input type="password" id="pin" autocomplete="current-password" placeholder="Staff PIN" required>
        </div>
        <p id="login-error" class="error"></p>
        <button class="btn block">Open counter desk <span class="arrow" aria-hidden="true">›</span></button>
      </form>
    </section>

    <section id="desk" class="hidden desk-grid">
      <div class="glass card">
        <div class="toolbar">
          <div class="input-pill date-pill">
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>
            <label class="sr-only" for="day">Date</label>
            <input type="date" id="day">
          </div>
          <div class="input-pill">
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></span>
            <label class="sr-only" for="search">Search bookings</label>
            <input type="text" id="search" placeholder="Booking ID, name or mobile">
          </div>
          <button class="btn ghost" id="refresh" type="button">Refresh</button>
        </div>
        <h3 class="section-title" id="stats-title">Summary</h3>
        <div class="stats" id="stats"></div>
        <h3 class="section-title">Slot occupancy</h3>
        <div class="slots occupancy" id="slot-overview"></div>
      </div>

      <div class="glass card">
        <div id="desk-alert" class="alert error-box desk-alert" role="alert"></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Slot</th><th>Booking</th><th>Visitor</th><th>Mobile</th><th>Visitors</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="/admin.js"></script>
</body>
</html>
