<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maratha Museum – Counter</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <div>
        <h1>Counter Desk</h1>
        <p>Maratha Museum · Bookings and payments</p>
      </div>
      <nav><a href="/">Visitor booking page</a></nav>
    </div>
  </header>

  <main>
    <section id="login" class="card" style="max-width:420px;margin:24px auto">
      <h2 style="margin-top:0;color:var(--maroon)">Staff sign-in</h2>
      <form id="login-form">
        <div class="field"><label for="pin">Staff PIN</label><input type="password" id="pin" autocomplete="current-password" required></div>
        <p id="login-error" class="error"></p>
        <button class="btn block">Open counter desk</button>
      </form>
    </section>

    <section id="desk" class="hidden">
      <div class="card">
        <div class="toolbar">
          <div class="field"><label for="day">Date</label><input type="date" id="day"></div>
          <div class="field"><label for="search">Search</label><input type="text" id="search" placeholder="Booking ID, name or mobile"></div>
          <button class="btn secondary" id="refresh" type="button">Refresh</button>
        </div>
        <div class="stats" id="stats"></div>
        <h3 style="color:var(--maroon);margin:0 0 10px">Slot occupancy</h3>
        <div class="slots" id="slot-overview"></div>
      </div>

      <div class="card">
        <div id="desk-alert" class="alert error-box" role="alert"></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Slot</th><th>Booking ID</th><th>Name</th><th>Mobile</th><th>Visitors</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="/admin.js"></script>
</body>
</html>
